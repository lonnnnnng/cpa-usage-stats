name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend:
    # 作者：long。手动重跑也必须选择版本标签，避免将 main 误当成可安装版本发布。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install and Build Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run check
          pnpm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/dist/index.html
          retention-days: 1

  build-binary:
    needs: build-frontend
    # 作者：long。安装目标只有 Linux ARM64，直接在同架构 Runner 构建，避免其他平台占用发布队列。
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/dist

      - name: Compile and Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LIB_NAME="cpa-usage-stats.so"
          ZIP_NAME="cpa-usage-stats_${VERSION}_linux_arm64.zip"
          mkdir -p dist

          export GOOS="linux"
          export GOARCH="arm64"
          export CGO_ENABLED=1

          echo "==> Building CGO shared library: ${LIB_NAME} for linux/arm64..."
          go build -buildmode=c-shared -ldflags="-s -w -X cpa-usage-stats/internal/plugin.Version=${VERSION}" -o "${LIB_NAME}" .
          rm -f "cpa-usage-stats.h"

          echo "==> Packaging into ${ZIP_NAME}..."
          go run ./cmd/packager -src "${LIB_NAME}" -out "dist/${ZIP_NAME}" -checksum "dist/checksum.line"
          rm -f "${LIB_NAME}"

      - name: Upload platform zip
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: dist/*
          retention-days: 1

  publish-release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux ARM64 release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-linux-arm64
          path: release-assets

      - name: Prepare Release Assets
        run: |
          # 作者：long。只接收 ARM64 构建产物，并在上传前核验摘要，防止其他工件混入 Release。
          test -f "release-assets/cpa-usage-stats_${GITHUB_REF_NAME#v}_linux_arm64.zip"
          mv release-assets/checksum.line release-assets/checksums.txt
          cd release-assets
          sha256sum -c checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*_linux_arm64.zip
            release-assets/checksums.txt
          generate_release_notes: true
